# A single media source, so the sidebar shows one "Bilder" entry covering the
# whole image tree. Per-collection separation happens on the fields instead:
# each image field sets `path` to its subfolder, which is where that field
# starts browsing and where its uploads land.
#
# `input` is where files are stored in the repo; `output` is the prefix written
# into the content file, replacing `input`. So an upload from the Aktuelt hero
# field is stored at src/assets/images/blog/foo.jpg and written into the
# frontmatter as ../../assets/images/blog/foo.jpg.
#
# That output is *relative* on purpose: the schemas use Astro's image() helper,
# which resolves paths relative to the markdown file and rejects root-absolute
# ones ("/blog/foo.png" fails the build with image-not-found). Every content
# file sits exactly two levels below src/ (src/content/<collection>/<file>.mdx),
# so ../../ resolves to src/.
#
# Going through src/assets rather than public/ is what buys the image pipeline:
# hero images come out hashed and converted to WebP instead of being served at
# whatever size they were uploaded.
media:
  - name: images
    label: Bilder
    input: src/assets/images
    output: ../../assets/images
    extensions: [png, jpg, jpeg, webp, svg, gif, avif]

content:
  - name: blog
    label: Aktuelt
    type: collection
    path: src/content/blog
    filename: "{primary}-{year}-{month}-{day}.mdx"
    view:
      fields: [heroImage, title, pubDate, updatedDate]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Tittel
        type: string
        required: true
        description: "Tittelen vil også bli brukt i URL-en"
      - name: description
        label: Beskrivelse
        type: text
        required: true
        options:
          rows: 2
          maxLength: 150
      - name: pubDate
        label: Publiseringsdato
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - name: updatedDate
        label: Oppdatert
        type: date
        default: ""
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - name: authors
        label: Forfatter(e)
        type: select
        creatable: true
        multiple: true
        options:
          values: []
      - name: heroImage
        label: Hovedbilde
        type: image
        options:
          media: images
          # Default browse/upload folder for this field, as a repo path.
          path: src/assets/images/blog
          extensions: [png, jpg, jpeg, webp, svg, gif, avif]
      # `body` is the reserved field name that PagesCMS maps to the markdown
      # below the frontmatter — see the note on the Om page below. Astro
      # renders it through <Content /> in src/pages/aktuelt/[...slug].astro.
      - name: body
        label: Innhold
        type: rich-text
        options:
          format: markdown
          media: images
          path: src/assets/images/blog
          extensions: [png, jpg, jpeg, webp, svg, gif, avif]

  - name: event
    label: Arrangementer
    type: collection
    path: src/content/event
    filename: "{primary}-{year}-{month}-{day}.mdx"
    view:
      fields: [heroImage, title, pubDate, updatedDate]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Tittel
        type: string
        required: true
        description: "Tittelen vil også bli brukt i URL-en"
      - name: description
        label: Beskrivelse
        type: text
        required: true
        options:
          rows: 2
          maxLength: 150
      - name: startDate
        label: Starttidspunkt
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - name: endDate
        label: Sluttidspunkt
        type: date
        default: ""
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - name: venue
        label: Spillested
        type: select
        required: true
        creatable: true
        options:
          values: [Arbeidern, Nordis, Trevarefabrikken, Kulturhuset, TBA]
      - name: pubDate
        label: Publiseringsdato
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - name: updatedDate
        label: Oppdatert
        type: date
        options:
          time: true
          format: yyyy-MM-dd HH:mm
      - name: authors
        label: Forfatter(e)
        type: select
        creatable: true
        multiple: true
        options:
          values: []
      - name: heroImage
        label: Hovedbilde
        type: image
        options:
          media: images
          path: src/assets/images/event
          extensions: [png, jpg, jpeg, webp, svg, gif, avif]
      # Rendered by <Content /> in src/pages/arrangement/[...slug].astro.
      - name: body
        label: Innhold
        type: rich-text
        options:
          format: markdown
          media: images
          path: src/assets/images/event
          extensions: [png, jpg, jpeg, webp, svg, gif, avif]

  # Single file rather than a collection: one editable page, not a list. The
  # field named `body` is special — PagesCMS maps it to the markdown below the
  # frontmatter, while every other field stays in the frontmatter.
  - name: om
    label: Om
    type: file
    path: src/content/page/om.mdx
    fields:
      - name: title
        label: Tittel
        type: string
        required: true
      - name: description
        label: Beskrivelse
        type: text
        required: true
        options:
          rows: 2
          maxLength: 150
      - name: authors
        label: Forfatter(e)
        type: select
        options:
          creatable: true
          multiple: true
          values: []
      - name: body
        label: Innhold
        type: rich-text
        options:
          format: markdown
          media: images
          path: src/assets/images/page
          extensions: [png, jpg, jpeg, webp, svg, gif, avif]

settings:
  hide: true
  content:
    merge: true
